<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>VortexChat OBS Studio Overlay — PFT Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #chat-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .msg-row {
      margin-top: 6px;
      line-height: 1.45;
      color: #fff;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
      animation: slideIn 0.25s ease-out forwards;
      transition: opacity 0.6s ease;
    }
    .msg-row.fading {
      opacity: 0;
    }
    .msg-box {
      display: inline;
      background: rgba(11, 13, 20, 0.78);
      padding: 3px 8px;
      border-radius: 4px;
      border-left: 3px solid #06b6d4;
      backdrop-filter: blur(2px);
    }
    .badge-icon {
      height: 16px;
      width: 16px;
      vertical-align: middle;
      margin-right: 3px;
      border-radius: 2px;
    }
    .user-name {
      font-weight: 700;
      margin-right: 6px;
    }
    .emote-img {
      height: 28px;
      max-width: 90px;
      vertical-align: middle;
      margin: -4px 2px 0 2px;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="chat-wrapper"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetChannel = (params.get('channel') || 'xqc').toLowerCase();
    const fadeSeconds = parseInt(params.get('fade') || '15', 10);
    const fontSize = parseInt(params.get('fontSize') || '16', 10);

    const chatWrapper = document.getElementById('chat-wrapper');
    chatWrapper.style.fontSize = fontSize + 'px';

    const emotes = new Map();

    fetch('https://7tv.io/v3/emote-sets/global')
      .then(r => r.json())
      .then(d => {
        (d.emotes || []).forEach(e => {
          if (e.data?.name) {
            emotes.set(e.data.name, 'https://cdn.7tv.app/emote/' + e.data.id + '/2x.webp');
          }
        });
      }).catch(() => {});

    function renderMessage(msg) {
      const row = document.createElement('div');
      row.className = 'msg-row';

      const box = document.createElement('div');
      box.className = 'msg-box';

      if (msg.badges && msg.badges.length > 0) {
        const badgeUrls = {
          broadcaster: 'https://static-cdn.jtvnw.net/badges/v1/5527c08c-d341-4003-9691-e2b3003c4221/2',
          moderator: 'https://static-cdn.jtvnw.net/badges/v1/32685ec2-acf8-42e0-b747-e88e9ffc139e/2',
          vip: 'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/2',
          founder: 'https://static-cdn.jtvnw.net/badges/v1/511b78a9-037b-42b4-b44c-2236a2872659/2',
          subscriber: 'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2aa4b60e408d/2',
          partner: 'https://static-cdn.jtvnw.net/badges/v1/d12a2e27-16f6-41d0-ab77-b780518f00a3/2',
          turbo: 'https://static-cdn.jtvnw.net/badges/v1/9384c43f-4ce7-4e94-b2a1-3875617c4e49/2',
          premium: 'https://static-cdn.jtvnw.net/badges/v1/bbbe0db0-a98a-422e-ac7a-33758b975005/2',
          bits: 'https://static-cdn.jtvnw.net/badges/v1/73b5c3fb-245e-4f5c-bac5-bdae84d76049/2'
        };

        msg.badges.forEach(b => {
          const badgeUrl = badgeUrls[b.name] || `https://static-cdn.jtvnw.net/badges/v1/${b.name}/1`;
          const img = document.createElement('img');
          img.className = 'badge-icon';
          img.src = badgeUrl;
          img.alt = b.name;
          img.onerror = () => { img.style.display = 'none'; };
          box.appendChild(img);
        });
      }

      const author = document.createElement('span');
      author.className = 'user-name';
      author.style.color = msg.color || '#38bdf8';
      author.textContent = (msg.displayName || msg.username) + ':';
      box.appendChild(author);

      const words = (msg.text || '').split(' ');
      words.forEach((w) => {
        if (emotes.has(w)) {
          const emoteImg = document.createElement('img');
          emoteImg.className = 'emote-img';
          emoteImg.src = emotes.get(w);
          box.appendChild(emoteImg);
        } else {
          box.appendChild(document.createTextNode(' ' + w));
        }
      });

      row.appendChild(box);
      chatWrapper.appendChild(row);

      while (chatWrapper.childNodes.length > 35) {
        chatWrapper.removeChild(chatWrapper.firstChild);
      }

      if (fadeSeconds > 0) {
        setTimeout(() => {
          row.classList.add('fading');
          setTimeout(() => row.remove(), 700);
        }, fadeSeconds * 1000);
      }
    }

    const ws = new WebSocket('ws://127.0.0.1:5222');
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.channel || data.channel.toLowerCase() === targetChannel) {
          renderMessage(data);
        }
      } catch (err) {}
    };
  </script>
</body>
</html>
