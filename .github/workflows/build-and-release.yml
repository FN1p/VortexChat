name: Build and Release VortexChat Windows Executables & 7TV Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package.json'

      - name: Install Desktop Dependencies
        working-directory: ./desktop-app
        run: npm ci

      - name: Check Desktop Logic
        run: node --test tests/desktop-auth.test.cjs tests/desktop-provider.test.cjs tests/desktop-single-instance.test.cjs tests/desktop-updater.test.cjs

      - name: Generate Branded Windows Installer Artwork
        shell: pwsh
        run: ./desktop-app/scripts/generate-installer-art.ps1

      - name: Compile Windows Installer & Portable Executables
        working-directory: ./desktop-app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package VortexChat (7TV v3) Browser Extension (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path ./extension/* -DestinationPath ./desktop-app/dist/VortexChat-7TV-Extension.zip -Force

      - name: Upload Build Artifacts (.exe + Extension .zip)
        uses: actions/upload-artifact@v4
        with:
          name: VortexChat-Release-Bundle
          path: |
            desktop-app/dist/VortexChat-Setup-*.exe
            desktop-app/dist/VortexChat-Portable-*.exe
            desktop-app/dist/VortexChat-7TV-Extension.zip

      - name: Publish Beta after tested main build
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release VortexChat Beta v1.3.16')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3.16-beta.17 ./desktop-app/dist/VortexChat-7TV-Extension.zip ./desktop-app/dist/VortexChat-Setup-1.3.16.exe ./desktop-app/dist/VortexChat-Portable-1.3.16.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "VortexChat v1.3.16-beta.17 (PFT Studio)" --notes "Beta 17: YouTube Live global 7TV emotes, BTTV wide/flip/stack modifiers and updated PFT chat controls."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop-app/dist/VortexChat-Setup-*.exe
            desktop-app/dist/VortexChat-Portable-*.exe
            desktop-app/dist/VortexChat-7TV-Extension.zip
          name: VortexChat ${{ github.ref_name }} (PFT Studio)
          body: |
            ## VortexChat 4.4.21 Beta 24
            - Replace settings emoji and player controls with consistent icons.
            - Controls, labels and buttons wrap without overlapping; popup uses a single scroll area.

            ## Загрузки
            - `VortexChat-7TV-Extension.zip` — расширение для Chrome.
            - `VortexChat-Setup-*.exe` и `VortexChat-Portable-*.exe` — приложение для Windows.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
