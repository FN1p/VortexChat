name: Build and Release VortexChat Windows Executables & 7TV Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package.json'

      - name: Install Desktop Dependencies
        working-directory: ./desktop-app
        run: npm ci

      - name: Check Desktop Logic
        run: node --test tests/desktop-auth.test.cjs tests/desktop-provider.test.cjs tests/desktop-single-instance.test.cjs tests/desktop-updater.test.cjs

      - name: Generate Branded Windows Installer Artwork
        shell: pwsh
        run: ./desktop-app/scripts/generate-installer-art.ps1

      - name: Compile Windows Installer & Portable Executables
        working-directory: ./desktop-app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package VortexChat (7TV v3) Browser Extension (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path ./extension/* -DestinationPath ./desktop-app/dist/VortexChat-7TV-Extension.zip -Force

      - name: Upload Build Artifacts (.exe + Extension .zip)
        uses: actions/upload-artifact@v4
        with:
          name: VortexChat-Release-Bundle
          path: |
            desktop-app/dist/VortexChat-Setup-*.exe
            desktop-app/dist/VortexChat-Portable-*.exe
            desktop-app/dist/VortexChat-7TV-Extension.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop-app/dist/VortexChat-Setup-*.exe
            desktop-app/dist/VortexChat-Portable-*.exe
            desktop-app/dist/VortexChat-7TV-Extension.zip
          name: VortexChat ${{ github.ref_name }} (PFT Studio)
          body: |
            ## Расширение VortexChat 4.4.10 Beta 15
            - FM и текст удалённых сообщений читаются из данных Twitch, когда они доступны.
            - Добавлены подсветка и звук упоминаний с исключениями для пользователей и каналов.
            - История ввода по стрелкам, группировка похожих повторов, быстрые ссылки и превью каналов.
            - Кнопка возврата к прямому эфиру и необязательное плавное ускорение при отставании.
            - Проверка обновлений в меню расширения.

            ## Загрузки
            - `VortexChat-7TV-Extension.zip` — расширение для Chrome. Распакуйте архив и выберите папку в `chrome://extensions` через «Загрузить распакованное расширение».
            - `VortexChat-Setup-*.exe` и `VortexChat-Portable-*.exe` — настольное приложение 1.3.14 для Windows. В этом релизе приложение не менялось.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
